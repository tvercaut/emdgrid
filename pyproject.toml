[build-system]
requires = ["scikit-build-core>=0.8.0", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pyemdgrid"
version = "0.1.0"
description = "Python bindings for emdgrid: Fast and exact optimal transport solvers for discrete histograms on regular grids"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Tom Vercauteren"}
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "scipy",
    "POT",
]

[tool.scikit-build]
cmake.args = [
    "-DEMDGRID_BUILD_PYTHON_BINDINGS=ON",
    "-DBUILD_TESTING=OFF",
    "-DEMDGRID_BUILD_EXAMPLES=OFF",
    "-DCLANG_TIDY_EXE=OFF",
]
wheel.packages = []

[tool.black]
# Matches requires-python. Without it black infers a target from the
# interpreter running it, which differs between a contributor's machine and
# CI and makes it warn that it cannot verify its own output.
target-version = ["py38"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pyflakes and pycodestyle for correctness, isort for import order, pyupgrade
# and flake8-bugbear for the idiom and footgun checks that pay for themselves.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The extension module this repo builds, so it belongs in its own group rather
# than folded in with the third-party imports.
known-first-party = ["pyemdgrid"]
