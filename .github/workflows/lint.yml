# GitHub Action to run code linting on all pushes and pull requests
# Adapted from https://github.com/cpplint/GitHub-Action-for-cpplint

name: lint
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    # Pinned: an unpinned formatter turns an upstream release into a red build
    # on unchanged code, and black's output has shifted between majors.
    - run: pip install cpplint 'black==26.5.1' 'ruff==0.16.8'
    - run: cpplint --recursive .
    - run: black --check .
    - run: ruff check .
