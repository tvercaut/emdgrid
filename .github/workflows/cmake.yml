name: CMake

on: [push, pull_request]

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          build_python_bindings: ON
        - os: windows-latest
          build_python_bindings: OFF
        - os: macos-latest
          build_python_bindings: OFF

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install CMake 4.4
      run: python -m pip install cmake==4.4.0

    - name: Install Python test dependencies
      if: matrix.build_python_bindings == 'ON'
      run: python -m pip install pytest numpy scipy POT

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCLANG_TIDY_EXE=OFF -DEMDGRID_BUILD_PYTHON_BINDINGS=${{ matrix.build_python_bindings }} .

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run clang-tidy checks
      if: matrix.os == 'ubuntu-latest'
      uses: cpp-linter/cpp-linter-action@v2
      id: linter
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        database: '${{github.workspace}}/build'
        style: ''

    - name: Fail workflow on clang-tidy issues
      if: matrix.os == 'ubuntu-latest' && steps.linter.outputs.checks-failed > 0
      run: exit 1

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
