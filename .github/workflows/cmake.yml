name: CMake

on: [push, pull_request]

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          build_python_bindings: ON
          use_asan: ON
        - os: windows-latest
          build_python_bindings: OFF
          use_asan: OFF
        - os: macos-latest
          build_python_bindings: OFF
          use_asan: OFF

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install CMake 4.4
      run: python -m pip install cmake==4.4.0

    - name: Install Python test dependencies
      if: matrix.build_python_bindings == 'ON'
      run: python -m pip install pytest numpy scipy POT

    - name: Install optional tools (clang-tidy)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y clang-tidy libomp-dev

    - name: Enable clang-tidy problem matcher
      if: matrix.os == 'ubuntu-latest'
      run: echo "::add-matcher::.github/clang-tidy-matcher.json"

    - name: Download OR-Tools binaries
      id: get_ortools
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python tools/get_ortools.py --show-progress off

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH="${{ steps.get_ortools.outputs.ortools_dir }}" -DEMDGRID_BUILD_PYTHON_BINDINGS=${{ matrix.build_python_bindings }} -DUSE_ASAN=${{ matrix.use_asan }} .

    - name: Build
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          export PATH="${{ steps.get_ortools.outputs.ortools_dir }}/bin:$PATH"
        fi
        cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Test
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          export PATH="${{ steps.get_ortools.outputs.ortools_dir }}/bin:$PATH"
        fi
        ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

  pip-install:
    # Exercises the same path as `pip install git+https://...` on a fresh
    # machine (e.g. Google Colab): no manual get_ortools.py step and no
    # -DCMAKE_PREFIX_PATH, unlike the `build` job above. This is what would
    # have caught the CMakeLists.txt regression where find_package(ortools)
    # only offered a manual fallback instead of fetching one automatically.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install pyemdgrid via pip
      run: python -m pip install .

    - name: Install notebook execution dependencies
      run: python -m pip install jupyter nbconvert nbclient matplotlib scipy POT

    - name: Execute colab_demo notebook
      run: |
        jupyter nbconvert --to notebook --execute example/colab_demo.ipynb \
          --output /tmp/colab_demo_executed.ipynb --ExecutePreprocessor.timeout=120
