name: CMake

on: [push, pull_request]

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          build_python_bindings: ON
          use_asan: ON
        - os: windows-latest
          build_python_bindings: OFF
          use_asan: OFF
        - os: macos-latest
          build_python_bindings: OFF
          use_asan: OFF

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install CMake 4.4
      run: python -m pip install cmake==4.4.0

    - name: Install Python test dependencies
      if: matrix.build_python_bindings == 'ON'
      run: python -m pip install pytest numpy scipy POT

    - name: Install optional tools (clang-tidy)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y clang-tidy

    - name: Enable clang-tidy problem matcher
      if: matrix.os == 'ubuntu-latest'
      run: echo "::add-matcher::.github/clang-tidy-matcher.json"

    - name: Download OR-Tools binary
      shell: bash
      run: |
        case "${{ matrix.os }}" in
          ubuntu-latest)
            URL="https://github.com/google/or-tools/releases/download/v9.12/or-tools_amd64_ubuntu-24.04_cpp_v9.12.4544.tar.gz"
            ;;
          macos-latest)
            URL="https://github.com/google/or-tools/releases/download/v9.12/or-tools_arm64_macOS-15.3.1_cpp_v9.12.4544.tar.gz"
            ;;
          windows-latest)
            URL="https://github.com/google/or-tools/releases/download/v9.12/or-tools_x64_VisualStudio2022_cpp_v9.12.4544.zip"
            ;;
        esac

        mkdir -p "${{ runner.temp }}/ortools"
        if [[ "$URL" == *.zip ]]; then
          curl -L "$URL" -o "${{ runner.temp }}/ortools.zip"
          python3 -c "import zipfile, glob, shutil; zipfile.ZipFile('${{ runner.temp }}/ortools.zip').extractall('${{ runner.temp }}/tmp'); sub = glob.glob('${{ runner.temp }}/tmp/or-tools_*')[0]; [shutil.move(f, '${{ runner.temp }}/ortools/') for f in glob.glob(sub + '/*')]"
        else
          curl -L "$URL" -o "${{ runner.temp }}/ortools.tar.gz"
          tar -xzf "${{ runner.temp }}/ortools.tar.gz" -C "${{ runner.temp }}/ortools" --strip-components=1
        fi

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_PREFIX_PATH="${{ runner.temp }}/ortools" -DEMDGRID_BUILD_PYTHON_BINDINGS=${{ matrix.build_python_bindings }} -DUSE_ASAN=${{ matrix.use_asan }} .

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
