name: CMake

on: [push, pull_request]

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          build_python_bindings: ON
          use_asan: ON
        - os: windows-latest
          build_python_bindings: OFF
          use_asan: OFF
        - os: macos-latest
          build_python_bindings: OFF
          use_asan: OFF

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: lukka/run-vcpkg@v11

    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install CMake 4.4
      run: python -m pip install cmake==4.4.0

    - name: Install Python test dependencies
      if: matrix.build_python_bindings == 'ON'
      run: python -m pip install pytest numpy scipy POT

    - name: Install optional tools (clang-tidy)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y clang-tidy

    - name: Enable clang-tidy problem matcher
      if: matrix.os == 'ubuntu-latest'
      run: echo "::add-matcher::.github/clang-tidy-matcher.json"

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DEMDGRID_BUILD_PYTHON_BINDINGS=${{ matrix.build_python_bindings }} -DUSE_ASAN=${{ matrix.use_asan }} .

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
